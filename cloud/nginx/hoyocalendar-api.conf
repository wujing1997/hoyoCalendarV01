# HoYoCalendar Cloud API — nginx 反向代理（邀请外部测试用户 / 上线域名前启用）
#
# 阶段安排（已与用户确认）：开发与内部验收通过 SSH 隧道访问；
# 邀请外部测试用户前必须购买域名并启用可信 HTTPS。
#
# 将该文件放入 /etc/nginx/sites-available/ 并软链到 sites-enabled/，
# 替换 api.example.com 为实际域名，并签发 TLS 证书（certbot/腾讯云 SSL）。
#
# 公网只暴露 443；应用与管理均只监听 127.0.0.1。

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate     /etc/nginx/ssl/api.example.com.pem;
    # ssl_certificate_key /etc/nginx/ssl/api.example.com.key;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
