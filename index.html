<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*;"
  >
  <title>HoYoCalendar V3.0</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light">
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-cluster">
          <span class="brand-mark" aria-hidden="true">
            <i data-lucide="calendar-days"></i>
          </span>
          <span class="brand-name">HoYoCalendar</span>
        </div>
        <div class="date-navigator">
          <button class="icon-btn" id="previousDate" title="上一个日期" aria-label="上一个日期">
            <i data-lucide="chevron-left"></i>
          </button>
          <button class="date-title-button" id="dateTitleButton" title="选择日期"></button>
          <button class="icon-btn" id="nextDate" title="下一个日期" aria-label="下一个日期">
            <i data-lucide="chevron-right"></i>
          </button>
          <button class="text-btn today-button" id="todayButton">今天</button>
        </div>
      </div>

      <div class="topbar-center">
        <div class="segmented-control" id="viewSwitch" role="tablist" aria-label="日历视图">
          <button class="segment active" data-view="day" role="tab" aria-selected="true">日</button>
          <button class="segment" data-view="week" role="tab" aria-selected="false">周</button>
          <button class="segment" data-view="month" role="tab" aria-selected="false">月</button>
        </div>
      </div>

      <div class="topbar-right">
        <button class="icon-btn top-search" id="searchButton" title="搜索日程" aria-label="搜索日程">
          <i data-lucide="search"></i>
        </button>
        <button class="icon-btn" id="assistantButton" title="日程助手" aria-label="打开日程助手">
          <i data-lucide="sparkles"></i>
          <span class="service-dot" id="serviceDot" aria-hidden="true"></span>
        </button>
        <button class="icon-btn top-theme" id="themeButton" title="切换明暗主题" aria-label="切换明暗主题">
          <i data-lucide="moon" id="themeIcon"></i>
        </button>
        <button class="icon-btn" id="settingsButton" title="设置" aria-label="打开设置">
          <i data-lucide="settings"></i>
        </button>
        <button class="icon-btn pin-button" id="pinButton" title="置顶窗口" aria-label="置顶窗口" aria-pressed="false">
          <i data-lucide="pin"></i>
        </button>
        <button class="icon-btn window-control" id="minimizeButton" title="最小化" aria-label="最小化">
          <i data-lucide="minus"></i>
        </button>
        <button class="icon-btn window-control maximize-button" id="maximizeButton" title="最大化" aria-label="最大化">
          <i data-lucide="square"></i>
        </button>
        <button class="icon-btn window-control close-button" id="closeButton" title="关闭" aria-label="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <section class="mini-calendar">
          <div class="mini-calendar-head">
            <strong id="miniCalendarTitle"></strong>
            <div class="mini-calendar-actions">
              <button class="icon-btn small" id="previousMonth" title="上个月" aria-label="上个月">
                <i data-lucide="chevron-left"></i>
              </button>
              <button class="icon-btn small" id="nextMonth" title="下个月" aria-label="下个月">
                <i data-lucide="chevron-right"></i>
              </button>
            </div>
          </div>
          <div class="mini-weekdays" aria-hidden="true">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="mini-days" id="miniDays"></div>
        </section>

        <nav class="sidebar-group" aria-label="日程范围">
          <p class="sidebar-label">日程</p>
          <button class="nav-item active" data-nav="today">
            <i data-lucide="crosshair"></i>
            <span>今天</span>
            <span class="nav-count" id="todayCount">0</span>
          </button>
          <button class="nav-item" data-nav="upcoming">
            <i data-lucide="calendar-range"></i>
            <span>未来七天</span>
            <span class="nav-count" id="upcomingCount">0</span>
          </button>
          <button class="nav-item" data-nav="all">
            <i data-lucide="list-todo"></i>
            <span>全部任务</span>
            <span class="nav-count" id="allCount">0</span>
          </button>
        </nav>

        <section class="sidebar-group">
          <p class="sidebar-label">日历</p>
          <button class="calendar-source active" data-calendar="个人">
            <span class="source-dot personal"></span>
            <span>个人</span>
            <i data-lucide="check"></i>
          </button>
          <button class="calendar-source active" data-calendar="工作">
            <span class="source-dot work"></span>
            <span>工作</span>
            <i data-lucide="check"></i>
          </button>
        </section>

        <button class="assistant-entry" id="sidebarAssistant">
          <i data-lucide="sparkles"></i>
          <span>
            <strong>日程助手</strong>
            <small>批量调整与复杂查询</small>
          </span>
          <i data-lucide="chevron-right"></i>
        </button>
      </aside>

      <main class="main-panel">
        <div class="compact-week" id="compactWeek"></div>

        <header class="main-header">
          <div class="main-heading">
            <h1 id="mainDateTitle"></h1>
            <p id="daySummary"></p>
          </div>
          <div class="main-header-actions">
            <div class="mobile-view-switch segmented-control" role="tablist" aria-label="日历视图">
              <button class="segment active" data-view="day" role="tab" aria-selected="true">日</button>
              <button class="segment" data-view="week" role="tab" aria-selected="false">周</button>
              <button class="segment" data-view="month" role="tab" aria-selected="false">月</button>
            </div>
            <button class="text-btn focus-button" id="focusButton" aria-pressed="false">
              <i data-lucide="focus"></i>
              <span>仅看未完成</span>
            </button>
          </div>
        </header>

        <div class="view-content" id="viewContent"></div>

        <footer class="composer">
          <div class="parse-preview" id="parsePreview">
            <span>支持日期、时间、时长、重复与截止日期</span>
          </div>
          <div class="composer-row">
            <button class="icon-btn" id="composerAssistant" title="交给日程助手" aria-label="交给日程助手">
              <i data-lucide="sparkles"></i>
            </button>
            <label class="sr-only" for="quickInput">快速添加日程</label>
            <input
              id="quickInput"
              class="composer-input"
              type="text"
              autocomplete="off"
              placeholder="例如：明天 9 点项目会议 45 分钟"
            >
            <button class="composer-submit" id="quickSubmit" title="添加日程" aria-label="添加日程">
              <i data-lucide="plus"></i>
            </button>
          </div>
        </footer>
      </main>

      <aside class="details-panel">
        <header class="details-head">
          <strong>任务详情</strong>
          <div class="details-actions">
            <button class="icon-btn small" id="duplicateDetail" title="复制任务" aria-label="复制任务">
              <i data-lucide="copy"></i>
            </button>
            <button class="icon-btn small danger-hover" id="deleteDetail" title="删除任务" aria-label="删除任务">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
        </header>
        <div id="detailsContent"></div>
      </aside>
    </div>
  </div>

  <div class="popover-menu" id="taskMenu" role="menu" aria-hidden="true">
    <button class="menu-item" data-menu-action="edit" role="menuitem">
      <i data-lucide="pencil"></i><span>编辑详情</span>
    </button>
    <button class="menu-item" data-menu-action="duplicate" role="menuitem">
      <i data-lucide="copy"></i><span>复制任务</span>
    </button>
    <div class="menu-divider"></div>
    <button class="menu-item danger" data-menu-action="delete" role="menuitem">
      <i data-lucide="trash-2"></i><span>删除</span>
    </button>
  </div>

  <div class="overlay" id="searchOverlay" aria-hidden="true">
    <section class="dialog search-dialog" role="dialog" aria-modal="true" aria-label="搜索日程">
      <div class="search-box">
        <i data-lucide="search"></i>
        <label class="sr-only" for="searchInput">搜索日程</label>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索标题、地点或任务类型">
        <button class="icon-btn" data-close-overlay="searchOverlay" title="关闭" aria-label="关闭搜索">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </section>
  </div>

  <div class="overlay" id="assistantOverlay" aria-hidden="true">
    <section class="dialog assistant-dialog" role="dialog" aria-modal="true" aria-label="日程助手">
      <header class="dialog-head">
        <div class="dialog-title">
          <i data-lucide="sparkles"></i>
          <span>日程助手</span>
          <span class="status-label" id="assistantStatus">检查服务中</span>
        </div>
        <div class="dialog-actions">
          <button class="icon-btn small" id="resetAssistant" title="清空对话" aria-label="清空对话">
            <i data-lucide="rotate-ccw"></i>
          </button>
          <button class="icon-btn small" data-close-overlay="assistantOverlay" title="关闭" aria-label="关闭日程助手">
            <i data-lucide="x"></i>
          </button>
        </div>
      </header>
      <div class="assistant-body" id="assistantBody">
        <div class="assistant-message">
          复杂查询、批量移动和删除任务可以在这里完成。
        </div>
        <div class="assistant-suggestions">
          <button class="suggestion-button">检查明天有没有时间冲突</button>
          <button class="suggestion-button">把本周未完成的任务移到周五</button>
          <button class="suggestion-button">列出所有还没完成的 Deadline</button>
        </div>
      </div>
      <div class="assistant-compose">
        <label class="sr-only" for="assistantInput">输入复杂日程指令</label>
        <input id="assistantInput" type="text" autocomplete="off" placeholder="输入复杂日程指令">
        <button class="composer-submit" id="assistantSend" title="发送" aria-label="发送">
          <i data-lucide="send"></i>
        </button>
      </div>
    </section>
  </div>

  <div class="overlay" id="settingsOverlay" aria-hidden="true">
    <section class="dialog settings-dialog" role="dialog" aria-modal="true" aria-label="设置">
      <header class="dialog-head">
        <div class="dialog-title">
          <i data-lucide="settings"></i>
          <span>设置</span>
        </div>
        <button class="icon-btn small" data-close-overlay="settingsOverlay" title="关闭" aria-label="关闭设置">
          <i data-lucide="x"></i>
        </button>
      </header>
      <div class="settings-content">
        <section class="settings-section">
          <h2>外观与窗口</h2>
          <label class="settings-row">
            <span>
              <strong>主题</strong>
              <small>选择浅色或深色界面</small>
            </span>
            <select id="themeSelect">
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
          <label class="settings-row">
            <span>
              <strong>窗口形态</strong>
              <small>在完整工作区与紧凑窗口间切换</small>
            </span>
            <select id="windowModeSelect">
              <option value="wide">完整工作区</option>
              <option value="compact">紧凑窗口</option>
            </select>
          </label>
          <label class="settings-row">
            <span>
              <strong>开机启动</strong>
              <small>登录 Windows 后自动打开</small>
            </span>
            <input class="switch-input" id="autoLaunchToggle" type="checkbox">
          </label>
        </section>

        <section class="settings-section">
          <h2>AI 服务</h2>
          <label class="settings-field">
            <span>提供商</span>
            <select id="aiProvider">
              <option value="doubao">豆包</option>
              <option value="ollama">Ollama</option>
              <option value="openai">OpenAI / 兼容服务</option>
            </select>
          </label>
          <div id="providerFields"></div>
        </section>

        <section class="settings-section about-section">
          <h2>关于</h2>
          <div class="about-row">
            <span>HoYoCalendar</span>
            <strong id="appVersion">V3.0.0</strong>
          </div>
          <button class="secondary-button" id="openLogsButton">
            <i data-lucide="folder-open"></i>
            <span>打开日志目录</span>
          </button>
        </section>
      </div>
      <footer class="dialog-footer">
        <button class="primary-button" id="saveSettings">保存设置</button>
      </footer>
    </section>
  </div>

  <div class="mobile-detail-sheet" id="mobileDetailSheet" aria-hidden="true">
    <section class="mobile-sheet-panel" role="dialog" aria-modal="true" aria-label="任务详情">
      <div class="sheet-handle"></div>
      <header class="details-head">
        <strong>任务详情</strong>
        <button class="icon-btn" id="closeMobileDetail" title="关闭" aria-label="关闭任务详情">
          <i data-lucide="x"></i>
        </button>
      </header>
      <div id="mobileDetailsContent"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastMessage"></span>
    <button id="toastUndo">撤销</button>
  </div>

  <script src="node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
